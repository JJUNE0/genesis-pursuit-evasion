# Defender PPO hyperparams — **PR-Q TanhMean Gaussian variant**.
# Source: ppo_defender_squash.yaml.
# Δ + rationale: configs/train/ppo_attacker_tanhm.yaml 참조.

algorithm:
  class_name: PPO
  clip_param: 0.2
  desired_kl: 0.01
  entropy_coef: 0.0
  gamma: 0.99
  lam: 0.95
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  schedule: adaptive
  use_clipped_value_loss: true
  value_loss_coef: 1.0

actor:
  class_name: MLPModel
  hidden_dims: [256, 256, 256]
  activation: tanh
  distribution_cfg:
    class_name: agents.tanh_mean_gaussian.TanhMeanGaussianDistribution
    init_std: 1.0
    std_type: scalar

critic:
  class_name: MLPModel
  hidden_dims: [256, 256, 256]
  activation: tanh

obs_groups:
  actor: [policy]
  critic: [policy]

num_steps_per_env: 32
save_interval: 100
run_name: defender_tanhm_v0
logger: wandb
wandb_project: gpe_phase1
