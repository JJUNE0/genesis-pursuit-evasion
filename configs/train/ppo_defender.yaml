# Defender PPO hyperparams (Phase 1.0).
# Layout matches rsl-rl 5.2 OnPolicyRunner cfg (mirrors V3 sanity).
# obs_groups is overridden at runtime from env (Phase 1: actor=critic="policy").

algorithm:
  class_name: PPO
  clip_param: 0.2
  desired_kl: 0.01
  entropy_coef: 0.005
  gamma: 0.99           # MUST match envs/pe_1v1/cfgs.py reward.progress_gamma
  lam: 0.95
  learning_rate: 3.0e-4
  max_grad_norm: 1.0
  num_learning_epochs: 5
  num_mini_batches: 4
  schedule: adaptive
  use_clipped_value_loss: true
  value_loss_coef: 1.0

actor:
  class_name: MLPModel
  hidden_dims: [256, 256, 256]
  activation: tanh
  distribution_cfg:
    class_name: GaussianDistribution
    init_std: 1.0
    std_type: scalar

critic:
  class_name: MLPModel
  hidden_dims: [256, 256, 256]
  activation: tanh

# Phase 1: actor reads "policy" only; obs_groups is replaced at runtime
# with the env's value to enforce the source-of-truth contract.
obs_groups:
  actor: [policy]
  critic: [policy]

num_steps_per_env: 32
save_interval: 100
run_name: defender_v0
logger: wandb            # CLI may override with --logger tensorboard
wandb_project: gpe_phase1   # rsl-rl 5.x requires this when logger=wandb
