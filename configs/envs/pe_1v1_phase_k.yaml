# 1v1 Pursuit-Evasion env config — **Phase K** (Phase E + decay_steps=0).
# Source: pe_1v1_phase_e.yaml. Plan: 외부 권장 (2026-05-02):
#   "Phase E 셋팅으로 복귀 (ams_s2_v6 검증) + decay_steps=0 (dense constant) + TanhMean distribution"
#
# Δ vs Phase E:
#   reward.decay_steps : 80000 → 0   (dense → sparse decay 비활성, dense 항상 init)
#
# Rationale:
#   ams_s2_v[10-13] NaN crash 6번 + Phase J 단일 학습 NaN 발생.
#   진단: dense decay (80000 step ≈ 2500 PPO iter)가 단일 phase 1.5 학습 (5000+ iter)에서
#   거의 끝나면 sparse-only → self_crash trap. 또한 Squashed Gaussian의 atanh log_prob
#   분산이 PPO ratio 폭발 trigger.
#   처방:
#     1. distribution: SquashedGaussian → TanhMean (atanh 제거, 안정성)
#     2. decay_steps=0 (dense constant — 학습 끝까지 신호 유지)
#     3. Phase E 셋팅 그대로 (ams_s2_v6 검증된 영역)
#
# 검증 영역 (Phase E base):
#   ams_s2_v6: c14 |Δ|=0.085, 28 cycles 무사 (NaN 없음)

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 5.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0
  roll_max_deg: 60.0
  z_floor: 0.1
  v_max: 10.0
  bound_xyz: 5.0

spawn:
  attacker_init_pos:
    x: [0.5, 1.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  defender_init_pos:
    x: [-1.5, -0.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-3.0, -2.0]
    y: [-1.5, 1.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 0.99
  progress_max: 0.0002
  action_smooth_attacker: 1.0e-4
  action_smooth_defender: 5.0e-4    # Phase E original (PR-O TanhMean으로 bang-bang 자동 차단되면 1e-4로 약화 검토)
  existential: 0.0002
  existential_w1: 0.1
  omega_coef_attacker: 5.0e-5
  omega_coef_defender: 2.0e-5
  omega_clamp_max_sq:  25.0
  chase_coef_attacker_init:   0.001
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       1.0
  chase_coef_defender_init:   0.01
  chase_coef_defender_final:  0.0002
  chase_alpha_defender:       0.5
  chase_coef:        0.0002
  chase_alpha:       1.0
  goal_dense_coef:        0.0002
  goal_dense_coef_init:   0.01
  goal_dense_coef_final:  0.0002
  goal_dense_alpha:       0.5
  decay_steps:       0              # Phase E 80000 → 0 (dense constant)
  R_mission_win:    3.0
  R_captured:      -3.0
  R_timeout:        0.0
  R_capture_win:    3.0
  R_mission_failed: -3.0
  R_timeout_win:    0.0
  R_self_crash:    -3.0
  R_opp_crash:      0.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
