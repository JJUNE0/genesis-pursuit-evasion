# 1v1 Pursuit-Evasion env config — **Phase I** (R_timeout 페널티 도입).
# Source: pe_1v1_phase_h.yaml. Plan: ams_s2_v10_scratch 분석 (2026-05-01).
#
# Δ vs Phase H — strategic timeout 차단:
#   reward.R_timeout      : 0.0 → -1.0   (attacker 받는 timeout 페널티)
#   reward.R_timeout_win  : 0.0 → -1.0   (defender 받는 timeout 페널티)
#
# Rationale:
#   ams_s2_v10_scratch c15-c27: draw_rate 50-80% — 양쪽 정책이 strategic
#   timeout 영역에 수렴. capture/mission 시도 안 하고 episode 끝남.
#   timeout 시 reward = 0 → 양쪽이 안전한 outcome으로 학습.
#   처방: timeout = -1 (양쪽 음수) → jackpot 직접 추구 incentive 부여.
#
# 누적 시뮬 (8s, 1600 step):
#   timeout 시나리오: dense+24 + (-1) = +23 (Phase H: +24, Δ -1)
#   capture 성공: dense+27 + 3 = +30 (변화 없음)
#   PPO advantage: timeout이 양쪽 부정적 outcome → gradient signal 명확
#
# minimax 부등식:
#   R_self_crash(-2) ≤ R_captured(-1)        ✓
#   R_self_crash(-2) ≤ R_mission_failed(-1)  ✓
#   R_self_crash(-2) ≤ R_timeout(-1)         ✓ (자살이 timeout보다 큰 음수)
#   R_opp_crash(0) ≤ R_capture_win(3)        ✓
#   R_opp_crash(0) ≤ R_mission_win(3)        ✓

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 8.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0
  roll_max_deg: 60.0
  z_floor: 0.1
  v_max: 10.0
  bound_xyz: 10.0

spawn:
  attacker_init_pos:
    x: [0.5, 4.0]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  defender_init_pos:
    x: [-4.0, -0.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-10.0, -4.0]
    y: [-1.5, 1.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 0.99
  progress_max: 0.0002
  action_smooth_attacker: 1.0e-4
  action_smooth_defender: 1.0e-4
  existential: 0.0002
  existential_w1: 0.1
  omega_coef_attacker: 5.0e-5
  omega_coef_defender: 2.0e-5
  omega_clamp_max_sq:  25.0
  chase_coef_attacker_init:   0.003
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       0.15
  chase_coef_defender_init:   0.03
  chase_coef_defender_final:  0.0002
  chase_alpha_defender:       0.15
  chase_coef:        0.0002
  chase_alpha:       0.15
  goal_dense_coef:        0.0002
  goal_dense_coef_init:   0.03
  goal_dense_coef_final:  0.0002
  goal_dense_alpha:       0.1
  decay_steps:       80000
  R_mission_win:    3.0
  R_captured:      -1.0
  R_timeout:       -0.5              # Phase I — 0.0 → -1.0, then -0.5 (학습 격렬화 줄임, NaN trigger 차단)
  R_capture_win:    3.0
  R_mission_failed: -1.0
  R_timeout_win:   -0.5              # Phase I — 0.0 → -1.0, then -0.5
  R_self_crash:    -2.0
  R_opp_crash:      0.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
