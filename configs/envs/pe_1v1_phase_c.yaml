# 1v1 Pursuit-Evasion env config — **Phase C** (controller wrench saturation).
# Source: pe_1v1_phase_b.yaml. Plan: docs/notes/PR-N_wrench_saturation.md
#
# Δ vs Phase B:
#   action.rate_controller.enable_wrench_saturation : false → true
#
# Rationale (controller diag, scripts/test/diag_rate_controller.py):
#   bang-bang 명령 (T_norm=±1, ω_ref=±π) 시 mixer 후 thrust [-7.5, +7.5] N
#   분산 → max=4.4 N clamp로 motor 50% 0 RPM, 50% max → wrench 65% 손실.
#   즉 Phase B reward 처방의 "bang-bang 차단" incentive가 controller bug로
#   왜곡된 신호 받음. PR-N PX4-style wrench saturation handler 도입으로
#   motor saturation 자체를 차단 — 정책에 "saturate 영역 = 토크 0" 일관 신호.
#
# Phase 1.0/1.5 ckpt 호환성:
#   obs/action shape 무변경. controller 내부 wrench scaling만 추가 → actor가
#   같은 rate command 보내도 wrench 응답이 다름 → 첫 PPO iter에서 자연 적응.
#   c1 결과로 mismatch 진단: att_wr ≥ 0.50 / def_crash ≤ 200 권장.

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 5.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0
  roll_max_deg: 60.0
  z_floor: 0.1
  v_max: 10.0
  bound_xyz: 5.0

spawn:
  attacker_init_pos:
    x: [0.5, 1.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  defender_init_pos:
    x: [-1.5, -0.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-3.0, -2.0]
    y: [-1.5, 1.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 0.99
  progress_max: 0.0002
  action_smooth_attacker: 1.0e-4
  action_smooth_defender: 5.0e-4
  existential: 0.0002
  existential_w1: 0.1
  omega_coef_attacker: 5.0e-5
  omega_coef_defender: 2.0e-5
  omega_clamp_max_sq:  25.0
  chase_coef:        0.0002
  chase_coef_init:   0.001
  chase_coef_final:  0.0002
  chase_alpha:       1.0
  goal_dense_coef:        0.0002
  goal_dense_coef_init:   0.01
  goal_dense_coef_final:  0.0002
  goal_dense_alpha:       0.5
  decay_steps:       80000
  R_mission_win: 3.0
  R_captured: -1.0
  R_timeout: 0.0
  R_capture_win: 1.0
  R_mission_failed: -3.0
  R_timeout_win: 0.0
  R_self_crash: -3.0
  R_opp_crash:   0.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true   # Phase C — PX4-style control allocation
