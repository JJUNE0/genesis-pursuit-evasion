# Phase C — Curriculum Stage 0 (smallest world).
# Plan: docs/plans/phase_c_curriculum_scratch.md (v4 spec — 사용자 2026-05-05).
# Source: pe_1v1_phase_m_ams.yaml. action / sim / obs_scales 동일.
# reward: stage 0 한정 goal_dense_coef 5× 강화 (mission 인센티브 ↑).
#
# Δ vs AMS (env 좁힘):
#   spawn att x   : [0.5, 4.0]   → [0.5, 1.5]
#   spawn def x   : [-4.0, -0.5] → [-1.5, -0.5]
#   spawn xy y    : ±1.0         → ±0.3
#   spawn z       : [1.0, 1.5]   → [1.2, 1.4]
#   g_mission x   : [-10, -4]    → [-2.5, -1.5]
#   g_mission y   : ±1.5         → ±0.5
#   bound_x       : 12           → 4
#   bound_y/z     : 6            → 3
#   z_floor       : 0.05         → 0.30
#   pitch/roll_max: 150 (off)    → 50  (crash_on_attitude=true)
#   v_max         : 15 (off)     → 10  (crash_on_speed=true)
#
# Δ reward vs AMS (stage 0 only):
#   goal_dense_coef_init/final  : 0.01 → 0.05 (사용자 요청 — cycle 2 attacker
#                                  vs trained defender 학습 시 mission incentive 강화)

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 5.0

termination:
  # v6 자율 진단 (2026-05-05): bound 1m + attitude crash 50° + crash_on_speed=true
  # 조합으로 random action 시 episode 즉시 종료 → PPO 학습 데이터 부족 → vs stationary
  # 500 iter에서도 attacker_win_rate=0%. spawn spec은 유지, termination만 완화.
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0      # v6 50 → 60 (PPO random action 여유)
  roll_max_deg:  60.0
  crash_on_attitude: true
  v_max: 10.0              # crash_on_speed=false라 unused (penalty pad만)
  crash_on_speed: false    # v6 true → false (velocity_penalty가 regulate 전담)
  z_floor: 0.30            # 그대로 (spawn z [1.2,1.4]에서 0.9m 마진 충분)
  bound_xyz: 3.0
  bound_x: 3.0
  bound_y: 1.5             # v6 1.0 → 1.5 (stage 1 bound_y=2.0과 단조 유지)
  bound_z: 1.5

spawn:
  attacker_init_pos:
    x: [0.5, 1.5]
    y: [-0.3, 0.3]
    z: [1.2, 1.4]
  defender_init_pos:
    x: [-1.5, -0.5]
    y: [-0.3, 0.3]
    z: [1.2, 1.4]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-2.5, -1.5]
    y: [-0.5, 0.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 1.0
  progress_max:   0.01
  action_smooth_attacker: 5.0e-4
  action_smooth_defender: 5.0e-4
  existential: 0.0002   # v16 (2026-05-06): 0 → 0.0002 복구 (v10 best 차이점, attacker step persist)
  existential_w1: 0.0
  omega_coef_attacker: 5.0e-4
  omega_coef_defender: 5.0e-4
  omega_clamp_max_sq:  25.0
  attitude_pad_deg: 60.0
  attitude_coef:    2.0e-3
  velocity_pad:    12.0
  velocity_coef:   0.01
  z_safety_pad:    0.5
  z_safety_coef:   0.05
  bound_safety_pad: 1.0
  bound_safety_coef: 0.01
  chase_coef_attacker_init:   0.01
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       1.0
  chase_coef_defender_init:   0.02   # Set A (2026-05-06): 0.01 → 0.02 (×2 chase 강화)
  chase_coef_defender_final:  0.0004 # Set A: 0.0002 → 0.0004
  chase_alpha_defender:       1.0
  chase_coef:        0.0002
  chase_alpha:       1.0
  goal_dense_coef:        0.0
  goal_dense_coef_init:   0.05   # stage 0 한정 5× (사용자 명시 2026-05-05)
  goal_dense_coef_final:  0.05
  goal_dense_alpha:       1.0
  decay_steps:       0
  # v11 (2026-05-05): Option B + timeout off. Nash 균형 위한 minimax 강화.
  # 사용자 결정 — 승리/패배 격차 줄임 + 자살 부담 절반 + timeout zero-reward.
  # v12 (2026-05-05): timeout만 v10 복구 (사용자 결정). 그 외 v11 유지.
  # Set A (2026-05-06): v12 base + chase_coef_defender ×2 (위에 변경).
  # R_mission/capture_win은 v12 그대로 (10).
  # v17 (2026-05-07): R_mission_win/capture_win 10→20 (Option 2 — Set A base + ×2).
  R_mission_win:    20.0
  R_captured:       -7.0
  R_timeout:        -1.0
  R_capture_win:    20.0
  R_mission_failed: -7.0
  R_timeout_win:     1.0
  R_self_crash:    -10.0
  R_opp_crash:       1.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
