# Phase C — Curriculum Stage 1.
# Plan: docs/plans/phase_c_curriculum_scratch.md (v4 spec — 사용자 2026-05-05).
# Source: pe_1v1_phase_m_ams.yaml. action / sim / obs_scales / reward 동일.
#
# Δ vs Stage 0 (env 확장):
#   spawn att x   : [0.5, 1.5]   → [0.5, 2.5]
#   spawn def x   : [-1.5, -0.5] → [-2.5, -0.5]
#   spawn xy y    : ±0.3         → ±0.5
#   spawn z       : [1.2, 1.4]   → [1.1, 1.45]
#   g_mission x   : [-2.5, -1.5] → [-4.5, -2.5]
#   g_mission y   : ±0.5         → ±0.7
#   bound_x       : 4            → 6
#   bound_y/z     : 3            → 4
#   z_floor       : 0.30         → 0.25
#   pitch/roll_max: 50           → 55
#   v_max         : 10           → 10  (그대로)

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 5.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 55.0
  roll_max_deg:  55.0
  crash_on_attitude: true
  v_max: 10.0
  crash_on_speed: true
  z_floor: 0.25
  bound_xyz: 5.0
  bound_x: 5.0
  bound_y: 2.0      # v6 1.5 → 2.0 (stage 0 bound_y 1.5와 단조 유지)
  bound_z: 2.0

spawn:
  attacker_init_pos:
    x: [0.5, 2.5]
    y: [-0.5, 0.5]
    z: [1.1, 1.45]
  defender_init_pos:
    x: [-2.5, -0.5]
    y: [-0.5, 0.5]
    z: [1.1, 1.45]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-4.5, -2.5]
    y: [-0.7, 0.7]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 1.0
  progress_max:   0.01
  action_smooth_attacker: 5.0e-4
  action_smooth_defender: 5.0e-4
  existential: 0.0002   # v16 (2026-05-06): 0 → 0.0002 복구
  existential_w1: 0.0
  omega_coef_attacker: 5.0e-4
  omega_coef_defender: 5.0e-4
  omega_clamp_max_sq:  25.0
  attitude_pad_deg: 60.0
  attitude_coef:    2.0e-3
  velocity_pad:    12.0
  velocity_coef:   0.01
  z_safety_pad:    0.5
  z_safety_coef:   0.05
  bound_safety_pad: 1.0
  bound_safety_coef: 0.01
  chase_coef_attacker_init:   0.01
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       1.0
  chase_coef_defender_init:   0.02   # Set A: 0.01 → 0.02 (×2 chase)
  chase_coef_defender_final:  0.0004
  chase_alpha_defender:       1.0
  chase_coef:        0.0002
  chase_alpha:       1.0
  goal_dense_coef:        0.0
  goal_dense_coef_init:   0.01
  goal_dense_coef_final:  0.01
  goal_dense_alpha:       1.0
  decay_steps:       0
  # v11 (2026-05-05): Option B + timeout off — Nash 균형 강화.
  # Set A (2026-05-06): v12 base + chase_coef_defender ×2.
  R_mission_win:    20.0      # v17: 10 → 20
  R_captured:       -7.0
  R_timeout:        -1.0
  R_capture_win:    20.0      # v17: 10 → 20
  R_mission_failed: -7.0
  R_timeout_win:     1.0
  R_self_crash:    -10.0
  R_opp_crash:       1.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
