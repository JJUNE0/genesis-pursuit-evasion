# 1v1 Pursuit-Evasion env config — **Phase H** (jackpot:loss = 3:1 비대칭).
# Source: pe_1v1_phase_g.yaml. Plan: 사용자 의도 (2026-04-30):
#   "defender 잡는 것 > attacker 못 가게 하는 것"
#   "attacker 도착 > evade"
#   → 양쪽 jackpot(+3) 강조 + loss(-1) 약화. 대칭 유지 (양측 동일 magnitude).
#
# Δ vs Phase G (4 항목):
#   reward.R_captured       : -3.0 → -1.0   (attacker 잡힘 페널티 약화)
#   reward.R_mission_failed : -3.0 → -1.0   (defender 못 잡음 페널티 약화)
#   reward.R_self_crash     : -3.0 → -2.0   (부등식 유지: ≤ R_captured(-1))
#   reward.R_opp_crash      : 0.0  → 0.0    (그대로 — Phase A P0)
#
# minimax 부등식 (env.py:147-161) 검증:
#   R_self_crash(-2) ≤ R_captured(-1)        ✓ 자살이 더 큰 음수 → 자살 차단
#   R_self_crash(-2) ≤ R_mission_failed(-1)  ✓ defender 자살 차단
#   R_opp_crash(0) ≤ R_capture_win(3)        ✓
#   R_opp_crash(0) ≤ R_mission_win(3)        ✓
#
# 누적 시뮬 (8s episode, dist 5m 평균):
#   defender capture 성공: dense+27 + 3 = +30
#   defender 못 잡음:     dense+24 + (-1) = +23   (Phase G: +21, Δ +2)
#   attacker mission 성공: dense+28 + 3 = +31
#   attacker 잡힘:        dense + (-1) ≈ +27   (Phase G: +25)
# → 양쪽 다 자기 목적 달성 incentive 강조 (loss 약화)

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 8.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0
  roll_max_deg: 60.0
  z_floor: 0.1
  v_max: 10.0
  bound_xyz: 10.0

spawn:
  attacker_init_pos:
    x: [0.5, 4.0]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  defender_init_pos:
    x: [-4.0, -0.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-10.0, -4.0]
    y: [-1.5, 1.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 0.99
  progress_max: 0.0002
  action_smooth_attacker: 1.0e-4
  action_smooth_defender: 1.0e-4    # Phase G' 변경 유지
  existential: 0.0002
  existential_w1: 0.1
  omega_coef_attacker: 5.0e-5
  omega_coef_defender: 2.0e-5
  omega_clamp_max_sq:  25.0
  chase_coef_attacker_init:   0.003
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       0.15
  chase_coef_defender_init:   0.03
  chase_coef_defender_final:  0.0002
  chase_alpha_defender:       0.15
  chase_coef:        0.0002
  chase_alpha:       0.15
  goal_dense_coef:        0.0002
  goal_dense_coef_init:   0.03
  goal_dense_coef_final:  0.0002
  goal_dense_alpha:       0.1
  decay_steps:       80000
  # Phase H — terminal magnitude 비대칭 (jackpot:loss = 3:1, 대칭 유지)
  R_mission_win:    3.0
  R_captured:      -1.0              # Phase G -3.0 → -1.0
  R_timeout:        0.0
  R_capture_win:    3.0
  R_mission_failed: -1.0             # Phase G -3.0 → -1.0
  R_timeout_win:    0.0
  R_self_crash:    -2.0              # Phase G -3.0 → -2.0 (부등식 유지)
  R_opp_crash:      0.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
