# 1v1 Pursuit-Evasion env config — **Phase F** (spawn 확대 + alpha 완화).
# Source: pe_1v1_phase_e.yaml. Plan: TODO.md §5.6 + docs/notes/PR-P_phase_f_spawn.md
#
# Δ vs Phase E — ams_s2_v6 attacker 압도 collapse 처방:
#   spawn.attacker_init_pos.x : [0.5, 1.5]  → [2.0, 4.0]
#   spawn.defender_init_pos.x : [-1.5, -0.5] → [-4.0, -2.0]
#   g_mission.box.x           : [-3.0, -2.0] → [-6.0, -4.0]
#   termination.bound_xyz     : 5.0  → 10.0
#   reward.chase_alpha_attacker  : 1.0 → 0.3   (먼 거리에서도 evade 신호 유지)
#   reward.chase_alpha_defender  : 0.5 → 0.3   (먼 거리에서도 chase 신호 유지)
#   reward.goal_dense_alpha      : 0.5 → 0.2   (먼 거리에서도 goal 신호 유지)
#
# Rationale (ams_s2_v6 분석 2026-04-30):
#   ams_s2_v6 c1 att_wr=0.807, c5=0.951 (|Δ|=0.92) — attacker 압도 collapse.
#   원인: spawn 거리 ~3.5m에서 attacker mission 도달 시간 0.3-0.4s →
#   물리적 자연 우세. squashed actor + Phase E 대칭 reward로 이 우세 표면화.
#   처방:
#     1. spawn 확대: attacker → g_mission 거리 ~3.5m → ~8m (2.3×)
#        chase 시간 충분 → 자연 균형 회복.
#     2. chase_alpha 0.3: dist=8m signal exp(-2.4)=0.091 (alpha=1.0이면 0.0003 — 25× 약함)
#     3. goal_dense_alpha 0.2: dist=8m signal exp(-1.6)=0.20 (alpha=0.5면 0.018 — 11× 약함)
#     4. coef는 Phase E 그대로 (변수 격리, 학습 속도 유지)
#
# Coef 변경 안 한 것 (Phase E 그대로):
#   chase_coef_attacker_init: 0.001 / chase_coef_defender_init: 0.01
#   goal_dense_coef_init: 0.01
#   R_*: 모두 Phase E 그대로 (대칭 -3/+3 mission/capture)
#   omega_coef per-side, action_smooth per-side
#   enable_wrench_saturation: true

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 5.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0
  roll_max_deg: 60.0
  z_floor: 0.1
  v_max: 10.0
  bound_xyz: 10.0                  # Phase E 5.0 → 10.0

spawn:
  attacker_init_pos:
    x: [2.0, 4.0]                  # Phase E [0.5, 1.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  defender_init_pos:
    x: [-4.0, -2.0]                # Phase E [-1.5, -0.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-6.0, -4.0]                # Phase E [-3.0, -2.0]
    y: [-1.5, 1.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 0.99
  progress_max: 0.0002
  action_smooth_attacker: 1.0e-4
  action_smooth_defender: 5.0e-4
  existential: 0.0002
  existential_w1: 0.1
  omega_coef_attacker: 5.0e-5
  omega_coef_defender: 2.0e-5
  omega_clamp_max_sq:  25.0
  # Phase F — chase_alpha 완화 (먼 spawn에서도 신호 유지)
  chase_coef_attacker_init:   0.001     # Phase E 그대로
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       0.3       # Phase E 1.0 → 0.3
  chase_coef_defender_init:   0.01      # Phase E 그대로
  chase_coef_defender_final:  0.0002
  chase_alpha_defender:       0.3       # Phase E 0.5 → 0.3
  chase_coef:        0.0002
  chase_alpha:       0.3                # legacy fallback도 일치
  goal_dense_coef:        0.0002
  goal_dense_coef_init:   0.01          # Phase E 그대로
  goal_dense_coef_final:  0.0002
  goal_dense_alpha:       0.2           # Phase E 0.5 → 0.2
  decay_steps:       80000
  R_mission_win:    3.0
  R_captured:      -3.0
  R_timeout:        0.0
  R_capture_win:    3.0
  R_mission_failed: -3.0
  R_timeout_win:    0.0
  R_self_crash:    -3.0
  R_opp_crash:      0.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
