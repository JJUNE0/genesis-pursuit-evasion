# 1v1 Pursuit-Evasion env config — **Phase J** (Phase E base + spawn 확대 + alpha 0.3).
# Source: pe_1v1_phase_e.yaml. Plan: 사용자 의도 (2026-05-02):
#   "Phase E spawn range 늘이고 temperature alpha 0.3, reward 크기 그대로"
#
# Δ vs Phase E (7 항목):
#   sim.episode_length_s          : 5.0 → 8.0          (거리 늘면 task 시간 필요)
#   termination.bound_xyz         : 5.0 → 10.0         (spawn 확대)
#   spawn.attacker_init_pos.x     : [0.5, 1.5]  → [0.5, 4.0]    (curriculum 다양)
#   spawn.defender_init_pos.x     : [-1.5, -0.5] → [-4.0, -0.5] (대칭)
#   g_mission.box.x               : [-3.0, -2.0] → [-10.0, -4.0] (확대)
#   reward.chase_alpha_attacker   : 1.0 → 0.3   (멀리서도 evade 신호)
#   reward.chase_alpha_defender   : 0.5 → 0.3   (멀리서도 chase 신호)
#   reward.goal_dense_alpha       : 0.5 → 0.3   (멀리서도 goal 신호)
#   reward.action_smooth_defender : 5.0e-4 → 1.0e-4 (Phase G' 처방 — 느림 차단)
#
# 변경 안 한 것 (Phase E 그대로):
#   chase_coef_attacker_init: 0.001 / chase_coef_defender_init: 0.01
#   goal_dense_coef_init: 0.01
#   R_mission_win/R_capture_win: +3.0 / +3.0
#   R_captured/R_mission_failed:  -3.0 / -3.0  ← Phase E 강한 magnitude 유지
#   R_self_crash: -3.0
#   R_opp_crash: 0.0
#   R_timeout: 0.0   ← strategic timeout reward neutral (Phase E 안정)
#   omega_coef per-side, omega_clamp_max_sq=25
#   enable_wrench_saturation: true
#
# 누적 시뮬 (8s, 1600 step, avg dist 5m):
#   defender chase 누적: 0.01·exp(-1.5)·1600 = +3.6
#   terminal capture: +3
#   dense:terminal = 1.2:1 ← 균형 (Phase G의 10:1 압도와 다름, Phase E의 0.7:1 보강)
#
# minimax 부등식 (Phase E와 동일 — 검증):
#   R_self_crash(-3) ≤ R_captured(-3)        ✓
#   R_self_crash(-3) ≤ R_mission_failed(-3)  ✓
#   R_opp_crash(0) ≤ R_capture_win(3)        ✓
#   R_opp_crash(0) ≤ R_mission_win(3)        ✓

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 8.0    # Phase E 5.0 → 8.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0
  roll_max_deg: 60.0
  z_floor: 0.1
  v_max: 10.0
  bound_xyz: 10.0          # Phase E 5.0 → 10.0

spawn:
  attacker_init_pos:
    x: [0.5, 4.0]          # Phase E [0.5, 1.5] (확대)
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  defender_init_pos:
    x: [-4.0, -0.5]        # Phase E [-1.5, -0.5] (대칭 확대)
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-10.0, -4.0]       # Phase E [-3.0, -2.0] (확대)
    y: [-1.5, 1.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 0.99
  progress_max: 0.0002
  action_smooth_attacker: 1.0e-4
  action_smooth_defender: 1.0e-4    # Phase E 5e-4 → 1e-4 (Phase G' 처방)
  existential: 0.0002
  existential_w1: 0.1
  omega_coef_attacker: 5.0e-5
  omega_coef_defender: 2.0e-5
  omega_clamp_max_sq:  25.0
  # Phase J — chase_coef Phase E 그대로 (per-side coef 0.001/0.01), alpha만 0.3
  chase_coef_attacker_init:   0.001     # Phase E 그대로
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       0.3       # Phase E 1.0 → 0.3
  chase_coef_defender_init:   0.01      # Phase E 그대로
  chase_coef_defender_final:  0.0002
  chase_alpha_defender:       0.3       # Phase E 0.5 → 0.3
  chase_coef:        0.0002
  chase_alpha:       0.3
  goal_dense_coef:        0.0002
  goal_dense_coef_init:   0.01          # Phase E 그대로
  goal_dense_coef_final:  0.0002
  goal_dense_alpha:       0.3           # Phase E 0.5 → 0.3
  decay_steps:       80000
  R_mission_win:    3.0                 # Phase E 그대로 (강한 jackpot)
  R_captured:      -3.0
  R_timeout:        0.0                 # Phase E 그대로 (strategic timeout neutral)
  R_capture_win:    3.0
  R_mission_failed: -3.0
  R_timeout_win:    0.0
  R_self_crash:    -3.0
  R_opp_crash:      0.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
