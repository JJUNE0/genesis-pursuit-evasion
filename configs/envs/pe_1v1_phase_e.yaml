# 1v1 Pursuit-Evasion env config — **Phase E** (chase_coef per-side).
# Source: pe_1v1_phase_d.yaml. Plan: TODO.md §5.6.
#
# Δ vs Phase D — chase_coef를 per-side로 분리 (사용자 관측: Phase D에서
# attacker가 mission 학습 못함 — chase_coef 강화가 attacker r_evade에도 작용해
# defender 회피 비용이 R_self_crash 초과):
#   reward.chase_coef_attacker_init  : 0.001  (attacker r_evade — Phase C 수준)
#   reward.chase_coef_defender_init  : 0.01   (defender r_chase — Phase D 대칭)
#   reward.chase_alpha_attacker      : 1.0    (가까이서만 회피 — 비현실 차단)
#   reward.chase_alpha_defender      : 0.5    (멀리서도 chase 신호)
#
# attacker r_evade 비교 (d=2m):
#   Phase D (양쪽 0.01, α=0.5): -3.7e-3/step → 1000 step -3.7 (R_self_crash 초과)
#   Phase E (a=0.001, α=1.0):    -1.35e-4/step → 1000 step -0.135 (정상)
#
# defender r_chase 비교 (d=2m):
#   Phase D 동일 (대칭화 유지): +3.7e-3/step → 학습 신호 보존

sim:
  dt: 0.005
  substeps: 16
  episode_length_s: 5.0

termination:
  d_capture: 0.3
  g_mission_radius: 0.3
  pitch_max_deg: 60.0
  roll_max_deg: 60.0
  z_floor: 0.1
  v_max: 10.0
  bound_xyz: 5.0

spawn:
  attacker_init_pos:
    x: [0.5, 1.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  defender_init_pos:
    x: [-1.5, -0.5]
    y: [-1.0, 1.0]
    z: [1.0, 1.5]
  init_lin_vel: [0.0, 0.0, 0.0]

g_mission:
  box:
    x: [-3.0, -2.0]
    y: [-1.5, 1.5]
    z: [1.0, 1.5]

obs_scales:
  pos: 0.2
  vel: 0.2
  ang_vel: 0.31831

reward:
  progress_gamma: 0.99
  progress_max: 0.0002
  action_smooth_attacker: 1.0e-4
  action_smooth_defender: 5.0e-4
  existential: 0.0002
  existential_w1: 0.1
  omega_coef_attacker: 5.0e-5
  omega_coef_defender: 2.0e-5
  omega_clamp_max_sq:  25.0
  # Phase E — chase_coef per-side
  chase_coef_attacker_init:   0.001    # Phase C 수준 — attacker mission 학습 보호
  chase_coef_attacker_final:  0.0002
  chase_alpha_attacker:       1.0      # 가까이서만 (decay 빠름)
  chase_coef_defender_init:   0.01     # Phase D 대칭화 유지
  chase_coef_defender_final:  0.0002
  chase_alpha_defender:       0.5      # 멀리서도 chase 신호
  # Legacy 단일 키 — backward compat용 (per-side 명시 없으면 fallback)
  chase_coef:        0.0002
  chase_alpha:       1.0
  goal_dense_coef:        0.0002
  goal_dense_coef_init:   0.01
  goal_dense_coef_final:  0.0002
  goal_dense_alpha:       0.5
  decay_steps:       80000
  R_mission_win:    3.0
  R_captured:      -3.0
  R_timeout:        0.0
  R_capture_win:    3.0
  R_mission_failed: -3.0
  R_timeout_win:    0.0
  R_self_crash:    -3.0
  R_opp_crash:      0.0

action:
  simulate_action_latency: false
  action_latency_steps: 0
  clip_actions: 1.0
  action_mode: "rate"
  rate_controller:
    kp_rate: [0.05, 0.10, 0.10]
    kd_rate: [1.0e-4, 5.0e-5, 1.0e-4]
    max_body_rate: 3.141592653589793
    enable_wrench_saturation: true
